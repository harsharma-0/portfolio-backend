<!doctype html><html><body><h2>New project feedback</h2><p><strong>Name:</strong> {{ feedback.name }}</p><p><strong>Email:</strong> {{ feedback.email or 'Not provided' }}</p><p><strong>Project:</strong> {{ project.title }}</p><p><strong>Type:</strong> {{ feedback.feedback_type.value }}</p><p><strong>Message:</strong></p><p>{{ feedback.message | e | replace('\n', '<br>') | safe }}</p></body></html>
